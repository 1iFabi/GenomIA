[project]
name = "sequoh-backend"
version = "0.1.0"
description = "GenomIA Django backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "Django==5.2.6",
    "dj-database-url==3.0.1",
    "django-allauth==65.11.2",
    "django-cors-headers==4.6.0",
    "djangorestframework==3.15.2",
    "dnspython==2.7.0",
    "google-api-python-client==2.183.0",
    "google-auth[requests]==2.40.3",
    "google-auth-oauthlib==1.2.2",
    "gunicorn==21.2.0",
    "psycopg2-binary==2.9.10",
    "PyJWT==2.10.1",
    "python-dotenv==1.0.0",
    "whitenoise==6.6.0",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.uv]
# Django runs from this directory; it is not a distributable Python package.
package = false
# Preserve the frozen runtime snapshot without declaring transitives as direct.
# Update these constraints deliberately alongside the direct dependency pins.
constraint-dependencies = [
    "asgiref==3.9.1",
    "cachetools==5.5.2",
    "certifi==2025.8.3",
    "charset-normalizer==3.4.3",
    "google-api-core==2.25.1",
    "google-auth-httplib2==0.2.0",
    "googleapis-common-protos==1.70.0",
    "httplib2==0.31.0",
    "idna==3.10",
    "oauthlib==3.3.1",
    "packaging==25.0",
    "proto-plus==1.26.1",
    "protobuf==6.32.1",
    "pyasn1==0.6.1",
    "pyasn1-modules==0.4.2",
    "pyparsing==3.2.5",
    "requests==2.32.5",
    "requests-oauthlib==2.0.0",
    "rsa==4.9.1",
    "sqlparse==0.5.3",
    # Retain the old pin if needed later; the Python 3.11 graph does not use it.
    "typing-extensions==4.15.0",
    "tzdata==2025.2",
    "uritemplate==4.2.0",
    "urllib3==2.5.0",
]

# Regenerate the production compatibility export; do not edit it by hand:
# uv export --locked --no-dev --no-emit-project --no-hashes --output-file requirements.txt
# Local tooling: uv run ruff check . / uv run ruff format .
[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
extend-exclude = ["venv"]
force-exclude = true
cache-dir = ".venv/.ruff_cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
